services:
  - type: web
    name: aura-music
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix server install && npm --prefix ui install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
