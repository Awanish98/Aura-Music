<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d1b4e" />
      <stop offset="45%" stop-color="#140f24" />
      <stop offset="100%" stop-color="#07040d" />
    </radialGradient>
    
    <!-- Neon Pink Gradient -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d75" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Headphone Arc Gradient -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="80" cy="80" r="62" fill="url(#neonPink)" opacity="0.25" filter="url(#glow)" />

  <!-- Headphone Band Over Head -->
  <path d="M 28 80 A 54 54 0 0 1 132 80" fill="none" stroke="url(#headbandGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 36 78 A 46 46 0 0 1 124 78" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />

  <!-- Head Sphere -->
  <circle cx="80" cy="82" r="50" fill="url(#sphereGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Head Glass Highlight -->
  <ellipse cx="65" cy="56" rx="24" ry="12" fill="#ffffff" opacity="0.12" transform="rotate(-20 65 56)" />

  <!-- Cute Closed Happy Eyes -->
  <path d="M 56 82 Q 66 94 74 82" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 86 82 Q 94 94 104 82" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

  <!-- Cute Pink Blush Cheeks -->
  <circle cx="50" cy="92" r="5" fill="#ff2d75" opacity="0.45" filter="url(#glow)" />
  <circle cx="110" cy="92" r="5" fill="#ff2d75" opacity="0.45" filter="url(#glow)" />

  <!-- Left Ear Cushion -->
  <rect x="20" y="66" width="16" height="34" rx="8" fill="url(#neonPink)" filter="url(#glow)" />
  <rect x="22" y="68" width="12" height="30" rx="6" fill="#140f24" />
  <circle cx="28" cy="83" r="3.5" fill="#ff2d75" />

  <!-- Right Ear Cushion -->
  <rect x="124" y="66" width="16" height="34" rx="8" fill="url(#neonPink)" filter="url(#glow)" />
  <rect x="126" y="68" width="12" height="30" rx="6" fill="#140f24" />
  <circle cx="132" cy="83" r="3.5" fill="#ff2d75" />
</svg>
