[build]
  base = "ui"
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Proxy all /api requests seamlessly to the live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://aura-music-1no9.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback for SvelteKit
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
