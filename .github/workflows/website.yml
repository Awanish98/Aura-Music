name: Deploy website

on:
  push:
    branches: [main, master]
    paths: ['website/**', 'ui/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Aura Music Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies and Build
        env:
          BASE_PATH: /Aura-Music
        run: |
          cd ui
          npm install --legacy-peer-deps --engine-strict=false
          npm run build

      - name: Deploy to GitHub Pages branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ui/build
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/build

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
