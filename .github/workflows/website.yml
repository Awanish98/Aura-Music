name: Deploy website

on:
  push:
    branches: [master, main]
    paths: ['website/**', 'ui/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            website/pnpm-lock.yaml
            ui/pnpm-lock.yaml
      - name: Build Web App (UI)
        env:
          BASE_PATH: /Aura-Music/app
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build Landing Page Website
        run: |
          cd website
          pnpm install --frozen-lockfile
          pnpm build
      - name: Bundle Web App with Website
        run: |
          cp -r ui/build website/dist/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
