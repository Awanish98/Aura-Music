name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'ui/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install UI dependencies
        run: |
          cd ui
          npm install --legacy-peer-deps --engine-strict=false

      - name: Build Web App
        run: |
          cd ui
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd ui
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ui/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd ui/android
          ./gradlew assembleDebug --no-daemon --stacktrace || true

      - name: Build Android Release APK
        run: |
          cd ui/android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          if [ -f ui/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp ui/android/app/build/outputs/apk/debug/app-debug.apk release-apks/Aura-Music-debug.apk
          fi
          if [ -f ui/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp ui/android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/Aura-Music-release-unsigned.apk
          fi
          ls -la release-apks/

      - name: Upload Android APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-Android-APK
          path: release-apks/*.apk
          retention-days: 30
